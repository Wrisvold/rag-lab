AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RAG Lab static hosting: a private S3 bucket served through CloudFront with
  Origin Access Control, HTTPS only, index.html as the default document.
  No servers, no build step. Deploy with deploy/aws/deploy.sh or deploy.ps1.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name for the site files (lowercase, e.g. gcsu-cbis5530-rag-lab).
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront edge locations. PriceClass_100 (North America and Europe) is enough for a class.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: RAG Lab (CBIS 5530)
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized" policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        # To use a custom domain (e.g. raglab.gcsu.edu): request an ACM
        # certificate in us-east-1, then replace ViewerCertificate with
        #   AcmCertificateArn: arn:aws:acm:us-east-1:ACCOUNT:certificate/ID
        #   SslSupportMethod: sni-only
        #   MinimumProtocolVersion: TLSv1.2_2021
        # and add
        #   Aliases: [raglab.gcsu.edu]
        # then point a CNAME at the distribution domain name below.

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
    Description: Upload the app folder here (the deploy script does this).
  DistributionId:
    Value: !Ref Distribution
    Description: Needed to invalidate the cache after an upload.
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
    Description: The address to give students.
